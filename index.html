const nb=r=>{const n=r.n||NUT[r.id];return n?`<h2>Nährwerte pro Portion</h2><div class="card"><div class="row" style="justify-content:space-around;text-align:center">${[[n[0],"kcal"],[n[1]+" g","Eiweiß"],[n[2]+" g","Kohlenhydrate"],[n[3]+" g","Fett"]].map(x=>`<div><b style="font-size:19px">${x[0]}</b><div class="mut">${x[1]}</div></div>`).join("")}</div><div class="mut" style="margin-top:10px">Ungefähre Werte, berechnet aus Durchschnittswerten der Zutaten.</div></div>`:""};
let D=ls.get("d",{}),dOff=0,pend=null;
const FERT=[{n:"Dr. Oetker Ristorante Salame",v:[854,32,82,43]},{n:"Dr. Oetker Ristorante Pepperoni-Salame",v:[839,33,82,40]},{n:"Dr. Oetker Ristorante Salame Mozzarella Pesto",v:[920,32,83,49]},{n:"Dr. Oetker Die Ofenfrische Salami",v:[886,37,111,31]},{n:"Wagner Steinofen BBQ Style",v:[791,34,92,30]}];
const dk=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dlab=o=>o===0?"Heute":o===-1?"Gestern":dk(o).split("-").reverse().join(".");
const DS=()=>[...R.filter(r=>r.n||NUT[r.id]).map(r=>({n:r.name,v:r.n||NUT[r.id],u:"Portion"})),...FERT.map(f=>({n:f.n,v:f.v,u:"ganze Pizza"}))];
function vDay(){const E=D[dk(dOff)]||[],s=[0,0,0,0];E.forEach(e=>e.v.forEach((x,i)=>s[i]+=x));const ds=DS();
return `<div class="row" style="justify-content:space-between"><button class="btn sec sm" data-a="dm">‹</button><h1 style="margin:0">${dlab(dOff)}</h1><button class="btn sec sm" data-a="dp" ${dOff>=0?"disabled style=\"opacity:.3\"":""}>›</button></div>
<div class="card" style="margin-top:14px;text-align:center"><div class="big">${s[0]} kcal</div><div class="row" style="justify-content:space-around;margin-top:10px">${[["Eiweiß",s[1]],["Kohlenhydrate",s[2]],["Fett",s[3]]].map(x=>`<div><b style="font-size:19px">${x[1]} g</b><div class="mut">${x[0]}</div></div>`).join("")}</div></div>
${E.length?`<div class="card">${E.map(e=>`<div class="it"><span style="flex:1">${esc(e.n)}<div class="mut">${e.v[0]} kcal</div></span><button class="btn sec sm" data-a="de" data-id="${e.id}" aria-label="Entfernen">✕</button></div>`).join("")}</div>`:'<p class="mut">Noch nichts eingetragen. Tippe unten auf ein Gericht.</p>'}
<h2>Gegessen hinzufügen</h2>
${pend?`<div class="card"><b>${esc(pend.n)}</b><div class="mut">Wie viel hast du gegessen? 1x = 1 ${pend.u}</div><div class="chs" style="margin:8px 0 0">${[0.5,1,1.5,2,3].map(a=>`<button class="chip" data-a="pa" data-id="${a}">${fmt(a)}x</button>`).join("")}</div></div>`:""}
<div class="chs">${ds.map((d,i)=>`<button class="chip ${pend&&pend.n===d.n?"on":""}" data-a="pd" data-id="${i}">${esc(d.n)}</button>`).join("")}</div>
<label>Eigener Eintrag</label><div class="row"><input id="en" placeholder="z. B. Apfel"><input id="ek" type="number" inputmode="numeric" placeholder="kcal" style="width:100px"></div><button class="btn w" style="margin-top:8px" data-a="eAdd">Eintragen</button>`}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",5000)}
function alarm(n){toast(n+" ist fertig");try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}[0,700,1400].forEach(d=>setTimeout(()=>{try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(ac.currentTime+.5)}catch(e){}},d))}
const rl=()=>R.filter(r=>(cf==="Alle"||r.c===cf)&&r.name.toLowerCase().includes(q.toLowerCase())).map(r=>`<div class="card rc" data-a="open" data-id="${r.id}">${tile(r,"s")}<div><b>${esc(r.name)}</b><div class="mut">${r.c||""}, ${r.portions} Portionen${NUT[r.id]?", "+NUT[r.id][0]+" kcal pro Portion":""}</div></div></div>`).join("")||'<p class="mut">Keine Rezepte gefunden.</p>';
const rl0=()=>R.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())).map(r=>`<div class="card" data-a="open" data-id="${r.id}"><b>${esc(r.name)}</b><div class="mut">${r.portions} Portionen, ${lines(r.ing).length} Zutaten</div></div>`).join("")||'<p class="mut">Keine Rezepte gefunden. Tippe unten auf „Neues Rezept“.</p>';
const vList=()=>`<h1>Rezepte</h1><div class="chs">${["Alle",...CATS].map(c=>`<button class="chip ${c===cf?"on":""}" data-a="cf" data-id="${c}">${c}</button>`).join("")}</div><input id="q" placeholder="Rezept suchen" value="${esc(q)}" style="margin-bottom:12px"><div id="rl">${rl()}</div><button class="btn w" data-a="new">Neues Rezept</button>`;
function vDetail(){const r=R.find(x=>x.id===cur),f=serv/r.portions;
const ings=lines(r.ing).map(l=>{const p=parseIng(l);return p.a==null?l:fmt(p.a*f)+" "+p.t});
return `<div class="row" style="justify-content:space-between"><button class="btn sec sm" data-a="back">Zurück</button><button class="btn sec sm" data-a="edit">Bearbeiten</button></div>${tile(r,"l")}<label class="btn sec sm" style="margin:10px 0 0;display:inline-block">📷 Eigenes Foto<input id="ph" type="file" accept="image/*" hidden></label><h1>${esc(r.name)}</h1>
<div class="card row" style="justify-content:space-between"><span>Portionen</span><div class="stepper"><button class="btn sec sm" data-a="minus">−</button><b>${fmt(serv)}</b><button class="btn sec sm" data-a="plus">+</button></div></div>
<h2>Zutaten</h2><div class="card">${lines(r.ing).map((l,i)=>{const s=(r.st||{})[l];return `<div class="it"><span style="flex:1${s==="h"?";color:var(--mut)":""}">${esc(ings[i])}</span><button class="mk g ${s==="h"?"on":""}" data-a="st" data-id="${i}:h" aria-label="Habe ich">✓</button><button class="mk r ${s==="n"?"on":""}" data-a="st" data-id="${i}:n" aria-label="Brauche ich">✕</button></div>`}).join("")}</div>
<p class="mut">Grüner Haken = habe ich, rotes Kreuz = brauche ich. Alles mit rotem Kreuz landet automatisch auf der Einkaufsliste.</p>
<h2>Zubereitung</h2><div class="card"><ol style="margin:0;padding-left:22px">${lines(r.steps).map(s=>`<li style="margin:8px 0">${esc(s)}</li>`).join("")}</ol></div>${nb(r)}
<button class="btn sec w" data-a="del" style="margin-top:8px">${armDel?"Wirklich löschen?":"Rezept löschen"}</button>`}
function vEdit(){const r=edit==="new"?{name:"",portions:4,ing:"",steps:""}:R.find(x=>x.id===edit);
return `<h1>${edit==="new"?"Neues Rezept":"Rezept bearbeiten"}</h1><label style="margin-top:0">Name</label><input id="fn" value="${esc(r.name)}"><label>Bild</label><div class="chs">${EMO.map(e=>`<button class="chip ${e===eSel?"on":""}" data-a="emo" data-id="${e}">${e}</button>`).join("")}</div><label>Kategorie</label><div class="chs">${CATS.map(c=>`<button class="chip ${c===cSel?"on":""}" data-a="cat" data-id="${c}">${c}</button>`).join("")}</div><label>Portionen</label><input id="fp" type="number" inputmode="numeric" min="1" value="${r.portions}"><label>Zutaten (antippen zum Hinzufügen)</label><div class="chs">${QI.map(x=>`<button class="chip" data-a="qi" data-id="${x}">${x}</button>`).join("")}</div><textarea id="fi">${esc(r.ing)}</textarea><div class="mut">Eine Zutat pro Zeile, zum Beispiel 200 g Mehl. Die Menge am Anfang rechnet der Portionsrechner um.</div><label>Zubereitung (antippen zum Hinzufügen)</label><div class="chs">${QS.map(x=>`<button class="chip" data-a="qs" data-id="${x}">${x}</button>`).join("")}</div><textarea id="fs">${esc(r.steps)}</textarea><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cancel">Abbrechen</button><button class="btn w" data-a="saveR">Speichern</button></div>`}
const vShop=()=>`<h1>Einkauf</h1><div class="row" style="margin-bottom:12px"><input id="si" placeholder="Was brauchst du?"><button class="btn" data-a="addS">Hinzufügen</button></div>${S.length?`<div class="card">${S.map(i=>`<div class="it ${i.d?"d":""}"><input type="checkbox" data-a="tog" data-id="${i.id}" ${i.d?"checked":""}><span style="flex:1">${esc(i.t)}</span><button class="btn sec sm" data-a="rm" data-id="${i.id}" aria-label="Entfernen">✕</button></div>`).join("")}</div>`:'<p class="mut">Die Liste ist leer. Öffne ein Rezept und füge die Zutaten hinzu.</p>'}${S.some(i=>i.d)?'<button class="btn sec w" data-a="clr">Erledigte entfernen</button>':""}`;
const vTimer=()=>`<h1>Timer</h1><div class="card"><label style="margin-top:0">Was machst du?</label><div class="chs">${TD.map((d,i)=>`<button class="chip" data-a="td" data-id="${i}">${d.e} ${d.n}</button>`).join("")}</div><div id="th" class="mut"></div><label>Name</label><input id="tn" placeholder="zum Beispiel Nudeln"><label>Minuten</label><input id="tm" type="number" inputmode="decimal" min="0" value="10"><div class="row" style="margin:10px 0;flex-wrap:wrap">${[5,10,15,30,45].map(m=>`<button class="btn sec sm" data-a="pre" data-id="${m}">${m} min</button>`).join("")}</div><button class="btn w" data-a="tgo">Timer starten</button></div>${T.map(t=>`<div class="card row" style="justify-content:space-between"><div><div class="mut">${esc(t.n)}</div><div class="big" data-t="${t.id}">${t.done?"Fertig!":mmss(t.end-Date.now())}</div></div><button class="btn sec sm" data-a="tx" data-id="${t.id}">${t.done?"Entfernen":"Stopp"}</button></div>`).join("")}`;
function render(top){$("#view").innerHTML=tab==="s"?vShop():tab==="t"?vTimer():tab==="h"?vDay():edit?vEdit():cur?vDetail():vList();document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===tab));if(top)scrollTo(0,0)}
function act(a,id){
if(a==="tab"){tab=id;render(1)}
else if(a==="open"){cur=id;serv=R.find(x=>x.id===id).portions;armDel=false;render(1)}
else if(a==="back"){cur=null;armDel=false;render(1)}
else if(a==="new"){edit="new";eSel="🍽️";cSel="Sonstiges";render(1)}
else if(a==="edit"){edit=cur;const r0=R.find(x=>x.id===cur);eSel=r0.e||"🍽️";cSel=r0.c||"Sonstiges";render(1)}
else if(a==="cancel"){edit=null;render(1)}
else if(a==="plus"){serv=Math.min(99,Math.floor(serv)+1);syncShop(R.find(x=>x.id===cur));save();render()}
else if(a==="minus"){serv=Math.max(1,Math.ceil(serv)-1);syncShop(R.find(x=>x.id===cur));save();render()}
else if(a==="saveR"){const n=$("#fn").value.trim();if(!n){toast("Bitte gib dem Rezept einen Namen");return}
const d={name:n,e:eSel,c:cSel,portions:Math.max(1,parseInt($("#fp").value)||1),ing:$("#fi").value,steps:$("#fs").value};
if(edit==="new"){d.id=uid();R.unshift(d);cur=d.id}else Object.assign(R.find(x=>x.id===edit),d);
serv=d.portions;edit=null;save();render(1)}
else if(a==="del"){if(!armDel){armDel=true;render();return}R=R.filter(x=>x.id!==cur);cur=null;armDel=false;save();render(1)}
else if(a==="toShop"){const r=R.find(x=>x.id===cur),f=serv/r.portions;lines(r.ing).forEach(l=>{const p=parseIng(l);S.push({id:uid(),t:p.a==null?l:fmt(p.a*f)+" "+p.t,d:false})});save();toast("Zutaten stehen auf der Einkaufsliste")}
else if(a==="addS"){const v=$("#si").value.trim();if(v){S.push({id:uid(),t:v,d:false});save();render();$("#si").focus()}}
else if(a==="tog"){const i=S.find(x=>x.id===id);i.d=!i.d;save();render()}
else if(a==="rm"){const it=S.find(x=>x.id===id);if(it&&it.k)have(it.k);S=S.filter(x=>x.id!==id);save();render()}
else if(a==="clr"){S.filter(x=>x.d&&x.k).forEach(x=>have(x.k));S=S.filter(x=>!x.d);save();render()}
else if(a==="dm"){dOff--;pend=null;render()}
else if(a==="dp"){dOff=Math.min(0,dOff+1);pend=null;render()}
else if(a==="pd"){pend=DS()[id];render()}
else if(a==="pa"){const m=parseFloat(id),k=dk(dOff);D[k]=(D[k]||[]).concat({id:uid(),n:pend.n+" ("+fmt(m)+"x)",v:pend.v.map(x=>Math.round(x*m))});pend=null;save();render()}
else if(a==="de"){const k=dk(dOff);D[k]=(D[k]||[]).filter(x=>x.id!==id);save();render()}
else if(a==="eAdd"){const n=$("#en").value.trim(),c=parseInt($("#ek").value),k=dk(dOff);if(!n||!(c>=0)){toast("Bitte Name und kcal eingeben");return}D[k]=(D[k]||[]).concat({id:uid(),n,v:[c,0,0,0]});save();render()}
else if(a==="td"){const d=TD[id];$("#tn").value=d.n;$("#tm").value=d.m;$("#th").textContent=d.t||"";document.querySelectorAll('[data-a="td"]').forEach(b=>b.classList.toggle("on",b.dataset.id===id))}
else if(a==="pre"){$("#tm").value=id}
else if(a==="tgo"){const m=parseFloat($("#tm").value);if(!(m>0)){toast("Bitte gib die Minuten ein");return}
try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
T.push({id:uid(),n:$("#tn").value.trim()||"Timer",end:Date.now()+m*60000,done:false});save();render()}
else if(a==="st"){const q2=id.split(":"),r=R.find(x=>x.id===cur),l=lines(r.ing)[q2[0]];r.st=r.st||{};if(r.st[l]===q2[1])delete r.st[l];else r.st[l]=q2[1];syncShop(r);save();render()}
else if(a==="sv"){serv=parseFloat(id);render()}
else if(a==="cf"){cf=id;render()}
else if(a==="emo"||a==="cat"){if(a==="emo")eSel=id;else cSel=id;document.querySelectorAll('[data-a="'+a+'"]').forEach(b=>b.classList.toggle("on",b.dataset.id===id))}
else if(a==="qi"||a==="qs"){const t=$(a==="qi"?"#fi":"#fs");t.value+=(t.value&&!t.value.endsWith("\n")?"\n":"")+id}
else if(a==="tx"){T=T.filter(x=>x.id!==id);save();render()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.id)});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;$("#rl").innerHTML=rl()}else if(e.target.id==="sl"){document.querySelector(".stepper b").textContent=fmt(parseFloat(e.target.value))}});
document.addEventListener("change",e=>{if(e.target.id==="sl"){serv=parseFloat(e.target.value);render();return}if(e.target.id!=="ph"||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);R.find(x=>x.id===cur).img=c.toDataURL("image/jpeg",.75);save();render()};im.src=fr.result};fr.readAsDataURL(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="si")act("addS")});
setInterval(()=>{const now=Date.now();let fin=false;T.forEach(t=>{if(!t.done&&t.end<=now){t.done=true;fin=true;alarm(t.n)}});if(fin){save();if(tab==="t")render()}
document.querySelectorAll("[data-t]").forEach(el=>{const t=T.find(x=>x.id===el.dataset.t);if(t)el.textContent=t.done?"Fertig!":mmss(t.end-now)})},500);
render();
</script>
</body>
</html>
